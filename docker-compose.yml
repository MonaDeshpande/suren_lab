# =============================================================================
# Local PostgreSQL for SLS Lab (development)
# Start with:  docker compose up -d
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: sls_lab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sls_lab}
      POSTGRES_USER: ${POSTGRES_USER:-sls_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sls_secure_password}
    ports:
      # Host 5433 → container 5432 (avoids clash with local Windows Postgres on 5432)
      - "5433:5432"
    volumes:
      # Persist data between restarts
      - sls_pgdata:/var/lib/postgresql/data
      # Auto-run schema on first container create
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  sls_pgdata:
